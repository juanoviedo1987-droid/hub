<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Command Center · Juan Oviedo</title>
  
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <meta name="theme-color" content="#0F172A">

  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts & Tailwind CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#151F32',
              900: '#0F172A',
              950: '#090E17'
            },
            brand: {
              50: '#F0F9FF',
              400: '#38BDF8',
              500: '#0EA5E9',
              600: '#0284C7'
            }
          }
        }
      }
    }
  </script>

  <style>
    .tap-bounce {
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-bounce:active {
      transform: scale(0.98);
    }
    .pin-input::-webkit-outer-spin-button,
    .pin-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    details summary::-webkit-details-marker {
      display: none;
    }
    details[open] summary .chevron-icon {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="h-full bg-slate-900 font-sans antialiased text-slate-100 flex flex-col selection:bg-sky-500/30 selection:text-sky-200">

  <!-- ========================================================================= -->
  <!-- 1. PANTALLA DE ACCESO: HUELLA DIGITAL / BIOMETRÍA / PIN                   -->
  <!-- ========================================================================= -->
  <div id="pinScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/98 backdrop-blur-xl">
    <div class="w-full max-w-sm text-center space-y-6 bg-slate-850 p-6 sm:p-8 rounded-3xl border border-slate-750/70 shadow-2xl">
      
      <!-- Logo Moderno de Command Center -->
      <div class="inline-flex p-4 rounded-2xl bg-gradient-to-tr from-sky-500/20 via-indigo-500/15 to-emerald-500/20 border border-sky-400/30 text-sky-400 shadow-xl shadow-sky-950/40">
        <i data-lucide="fingerprint" class="w-10 h-10 text-sky-400"></i>
      </div>

      <div>
        <h1 class="text-xl font-heading font-extrabold text-white tracking-tight">Command Center</h1>
        <p class="text-xs text-slate-400 mt-1">Ecosistema Privado · Juan Oviedo</p>
      </div>

      <!-- Botón de Entrada con Huella Digital (Biometría / WebAuthn) -->
      <div class="space-y-3">
        <button type="button" id="bioBtn" onclick="authenticateWithBiometrics()" 
          class="tap-bounce w-full flex items-center justify-center gap-2.5 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-sky-500/25 cursor-pointer">
          <i data-lucide="scan-face" class="w-5 h-5"></i>
          <span>Ingresar con Huella / Rostro</span>
        </button>

        <div class="flex items-center gap-3 my-2 text-slate-500 text-[11px]">
          <div class="flex-1 border-t border-slate-700/60"></div>
          <span>o ingresá tu PIN</span>
          <div class="flex-1 border-t border-slate-700/60"></div>
        </div>

        <!-- Teclado de PIN alternativo sin sugerencias de contraseña del navegador -->
        <div class="flex justify-center">
          <input type="password" id="pinInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" name="hub_auth_pin"
            class="pin-input w-44 text-center tracking-[0.5em] text-2xl font-bold bg-slate-800/90 border border-slate-700/80 rounded-2xl py-2.5 text-white focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 shadow-inner"
            placeholder="••••" onkeyup="checkPinAuto(this.value)">
        </div>

        <p id="pinError" class="text-xs text-rose-400 font-medium hidden">Acceso incorrecto. Reintentá.</p>
        <p id="bioStatus" class="text-[11px] text-slate-400 hidden"></p>
      </div>

    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- 2. HUB PRINCIPAL (DESBLOQUEADO)                                          -->
  <!-- ========================================================================= -->
  <div id="hubScreen" class="hidden min-h-full flex flex-col bg-slate-900">
    
    <!-- Topbar con paleta amigable -->
    <header class="sticky top-0 z-40 bg-slate-850/90 backdrop-blur-lg border-b border-slate-750/80 px-4 py-3.5 sm:px-6">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-emerald-400 p-0.5 shadow-md shadow-sky-500/20 flex items-center justify-center">
            <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center text-sky-400">
              <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
          </div>
          <div>
            <h2 class="text-sm font-heading font-extrabold text-white leading-tight">Command Center</h2>
            <p class="text-[11px] text-slate-400">Juan Oviedo · Ecosistema de Operaciones</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Botón expandir/colapsar todos -->
          <button onclick="toggleAllAccordions()" id="toggleAllBtn" title="Expandir/Colapsar todo" 
            class="text-xs px-3 py-1.5 rounded-xl text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition flex items-center gap-1.5">
            <i data-lucide="chevrons-down-up" class="w-3.5 h-3.5 text-sky-400"></i>
            <span class="hidden sm:inline text-[11px]">Expandir</span>
          </button>
          
          <button onclick="lockScreen()" title="Bloquear" 
            class="p-2 rounded-xl text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </button>
        </div>

      </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-5">
      
      <!-- Buscador Rápido -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="searchInput" oninput="filterLinks(this.value)"
          placeholder="Buscar app, ERP, CRM, tienda o servicio..." 
          class="w-full bg-slate-850 border border-slate-700/70 rounded-2xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition shadow-sm">
      </div>

      <!-- Contenedor Desplegable (Acordeón de Proyectos) -->
      <div id="categoriesContainer" class="space-y-3.5">
        <!-- Renderizado dinámico vía JS -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-4 px-4 text-center text-xs text-slate-400 bg-slate-900">
      <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <span>© 2026 Juan Oviedo · Privado y Seguro</span>
        <span id="updatedAtLabel" class="text-[11px] text-slate-500">Sincronizado vía GitHub</span>
      </div>
    </footer>

  </div>

  <!-- Script Lógica -->
  <script>
    let HUB_DATA = null;
    const DEFAULT_PIN = "3585";
    let allExpanded = false;

    // Cargar datos desde links.json
    async function loadData() {
      try {
        const res = await fetch('links.json?v=' + Date.now());
        HUB_DATA = await res.json();
        renderHub(HUB_DATA);
      } catch (err) {
        console.error("Error cargando links.json:", err);
      }
    }

    // Biometría nativa WebAuthn (Huella / Rostro / Patrón de pantalla)
    async function authenticateWithBiometrics() {
      const bioBtn = document.getElementById('bioBtn');
      const errEl = document.getElementById('pinError');
      errEl.classList.add('hidden');

      if (!window.PublicKeyCredential) {
        showBioError("Tu navegador no soporta biometría WebAuthn. Ingresá con PIN.");
        document.getElementById('pinInput').focus();
        return;
      }

      try {
        const hasCred = localStorage.getItem('hub_bio_cred_id');
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        if (hasCred) {
          // Ya fue enrolado: Autenticar directamente con huella
          const credIdBytes = Uint8Array.from(atob(hasCred), c => c.charCodeAt(0));
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge: challenge,
              allowCredentials: [{
                id: credIdBytes,
                type: 'public-key',
                transports: ['internal']
              }],
              userVerification: 'required',
              timeout: 60000
            }
          });

          if (assertion) {
            unlockScreen();
          }
        } else {
          // Primer ingreso biométrico: Enrolar la huella del teléfono
          const userId = new Uint8Array(16);
          window.crypto.getRandomValues(userId);

          const newCred = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: "Command Center Juan", id: window.location.hostname },
              user: {
                id: userId,
                name: "juanoviedo1987",
                displayName: "Juan Oviedo"
              },
              pubKeyCredParams: [
                { alg: -7, type: "public-key" },  // ES256
                { alg: -257, type: "public-key" } // RS256
              ],
              authenticatorSelection: {
                authenticatorAttachment: "platform",
                userVerification: "required",
                residentKey: "preferred"
              },
              timeout: 60000
            }
          });

          if (newCred && newCred.rawId) {
            const b64Id = btoa(String.fromCharCode(...new Uint8Array(newCred.rawId)));
            localStorage.setItem('hub_bio_cred_id', b64Id);
            unlockScreen();
          }
        }
      } catch (err) {
        console.warn("Autenticación biométrica no completada:", err);
        if (err.name === 'NotAllowedError') {
          showBioError("Huella cancelada o no reconocida. Usá tu PIN.");
        } else {
          showBioError("Verificación biométrica: ingresá tu PIN de 4 dígitos.");
        }
        document.getElementById('pinInput').focus();
      }
    }

    function showBioError(msg) {
      const errEl = document.getElementById('pinError');
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    // Auto-check PIN
    function checkPinAuto(val) {
      if (val.length === 4) {
        const expected = HUB_DATA?.pin_hash || DEFAULT_PIN;
        if (val === expected) {
          unlockScreen();
        } else {
          document.getElementById('pinError').classList.remove('hidden');
          document.getElementById('pinInput').value = '';
        }
      }
    }

    function unlockScreen() {
      document.getElementById('pinScreen').classList.add('hidden');
      document.getElementById('hubScreen').classList.remove('hidden');
      sessionStorage.setItem('hub_unlocked', 'true');
      lucide.createIcons();
    }

    function lockScreen() {
      sessionStorage.removeItem('hub_unlocked');
      document.getElementById('pinScreen').classList.remove('hidden');
      document.getElementById('hubScreen').classList.add('hidden');
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').classList.add('hidden');
      document.getElementById('pinInput').focus();
    }

    function toggleAllAccordions() {
      const detailsList = document.querySelectorAll('details.project-accordion');
      allExpanded = !allExpanded;
      detailsList.forEach(d => d.open = allExpanded);
      const label = document.querySelector('#toggleAllBtn span');
      if (label) label.textContent = allExpanded ? 'Colapsar' : 'Expandir';
    }

    // Renderizar categorías y accesos en formato Desplegable (Accordion)
    function renderHub(data, filter = '') {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      if (data.updated_at) {
        document.getElementById('updatedAtLabel').textContent = 'Actualizado: ' + new Date(data.updated_at).toLocaleDateString('es-AR');
      }

      data.categories.forEach((cat) => {
        const filteredItems = cat.items.filter(item => {
          if (!filter) return true;
          const q = filter.toLowerCase();
          return item.title.toLowerCase().includes(q) || 
                 item.subtitle.toLowerCase().includes(q) || 
                 cat.name.toLowerCase().includes(q);
        });

        if (filteredItems.length === 0) return;

        const isFiltered = filter.length > 0;
        const isOpen = isFiltered ? 'open' : (allExpanded ? 'open' : '');

        const details = document.createElement('details');
        details.className = 'project-accordion group bg-slate-850/90 border border-slate-750/80 rounded-2xl overflow-hidden shadow-sm transition';
        if (isOpen) details.setAttribute('open', '');

        // Header del acordeón con paleta más amigable y luminosa
        details.innerHTML = `
          <summary class="list-none flex items-center justify-between p-3.5 sm:p-4 cursor-pointer select-none hover:bg-slate-800/70 transition tap-bounce">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-sky-400 shadow-xs">
                <i data-lucide="${cat.icon || 'folder'}" class="w-4.5 h-4.5"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-sm font-heading font-extrabold text-white tracking-tight">${cat.name}</h3>
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-800 text-sky-300 border border-slate-700">${cat.tag}</span>
                </div>
                <p class="text-[11px] text-slate-400">${filteredItems.length} accesos directos</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-slate-400 group-hover:text-white">
              <i data-lucide="chevron-down" class="chevron-icon w-4 h-4 transition-transform duration-200"></i>
            </div>
          </summary>
          <div class="p-3 sm:p-4 pt-1 border-t border-slate-800/80 bg-slate-900/40">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5" id="grid-${cat.id}"></div>
          </div>
        `;

        container.appendChild(details);
        const grid = document.getElementById(`grid-${cat.id}`);

        filteredItems.forEach(item => {
          const card = document.createElement('a');
          card.href = item.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.className = 'tap-bounce group flex items-start gap-3 p-3 rounded-xl bg-slate-800/80 hover:bg-slate-750 border border-slate-700/70 hover:border-sky-400/50 transition shadow-xs';

          card.innerHTML = `
            <div class="w-8 h-8 rounded-lg bg-slate-750 group-hover:bg-sky-500/15 border border-slate-700 group-hover:border-sky-400/40 flex items-center justify-center text-slate-300 group-hover:text-sky-400 shrink-0 transition mt-0.5">
              <i data-lucide="${item.icon || 'link'}" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1">
                <h4 class="text-xs font-heading font-bold text-white group-hover:text-sky-300 transition truncate">${item.title}</h4>
                <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded bg-slate-750 text-slate-300 border border-slate-700 shrink-0">${item.badge || 'Link'}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5 line-clamp-1">${item.subtitle}</p>
            </div>
            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-slate-500 group-hover:text-sky-400 shrink-0 mt-1 transition"></i>
          `;

          grid.appendChild(card);
        });
      });

      lucide.createIcons();
    }

    function filterLinks(term) {
      if (HUB_DATA) {
        renderHub(HUB_DATA, term);
      }
    }

    // Inicialización y Registro de Service Worker para PWA
    window.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      }
      loadData();
      if (sessionStorage.getItem('hub_unlocked') === 'true') {
        unlockScreen();
      } else {
        // Si el dispositivo ya usó huella, sugerir huella automático
        if (localStorage.getItem('hub_bio_registered') === 'true') {
          setTimeout(authenticateWithBiometrics, 300);
        } else {
          document.getElementById('pinInput').focus();
        }
      }
    });
  </script>
</body>
</html>
